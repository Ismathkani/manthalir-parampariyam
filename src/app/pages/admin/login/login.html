<div class="admin-login-page">
  <div class="login-wrapper">
    <!-- Back to public store link -->
    <a routerLink="/" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Return to Public Website</span>
    </a>

    <!-- Card Container -->
    <div class="login-card">
      <!-- Header with Logo and Brand Identity -->
      <div class="card-header">
        <div class="logo-circle">
          <img src="images/manthalir-logo.jpeg" alt="Manthalir Parampariyam Logo" class="brand-logo" />
        </div>
        <div class="brand-text">
          <span class="heritage-subtitle">மாந்தளிர் பாரம்பரியம்</span>
          <h1 class="portal-title">Admin Login</h1>
          <p class="portal-desc">Authorized Store Management Portal</p>
        </div>
      </div>

      <!-- Alerts -->
      <div *ngIf="errorMessage" class="alert-box error" role="alert">
        <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <div class="alert-content">
          <span>{{ errorMessage }}</span>
        </div>
      </div>

      <div *ngIf="successMessage" class="alert-box success" role="alert">
        <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <div class="alert-content">
          <span>{{ successMessage }}</span>
        </div>
      </div>

      <!-- Login Form -->
      <form (ngSubmit)="onSubmit()" class="login-form">
        <!-- Username Field -->
        <div class="form-group">
          <label for="adminUsername" class="form-label">
            <span>Administrator Username</span>
            <span class="required">*</span>
          </label>
          <div class="input-container">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input
              id="adminUsername"
              name="username"
              type="text"
              class="form-control"
              [(ngModel)]="username"
              (focus)="onInputFocus()"
              placeholder="Enter admin username"
              required
              autocomplete="username"
              [disabled]="isLoading"
            />
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="adminPassword" class="form-label">
            <span>Password</span>
            <span class="required">*</span>
          </label>
          <div class="input-container">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              id="adminPassword"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              class="form-control"
              [(ngModel)]="password"
              (focus)="onInputFocus()"
              placeholder="Enter password"
              required
              autocomplete="current-password"
              [disabled]="isLoading"
            />
            <button
              type="button"
              class="toggle-password-btn"
              (click)="togglePasswordVisibility()"
              [title]="showPassword ? 'Hide password' : 'Show password'"
              aria-label="Toggle password visibility"
            >
              <!-- Eye Off icon -->
              <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
              <!-- Eye icon -->
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          id="adminLoginSubmitBtn"
          type="submit"
          class="submit-button"
          [disabled]="isLoading"
        >
          <span *ngIf="!isLoading">Sign In to Dashboard</span>
          <span *ngIf="isLoading" class="loading-state">
            <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
              <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"></path>
            </svg>
            <span>Verifying Credentials...</span>
          </span>
        </button>
      </form>

      <!-- Security Notice Footer -->
      <div class="card-footer">
        <div class="security-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          <span>Server-Side Bcrypt & HttpOnly Cookie Session Security</span>
        </div>
      </div>
    </div>
  </div>
</div>
